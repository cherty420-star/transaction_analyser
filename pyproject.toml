[project]
name = "transaction-analyser"
version = "1.0.0"
description = "Анализатор банковских транзакций"
authors = [
    {name = "Студент", email = "student@example.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.1.0,<3.0.0",
    "openpyxl>=3.1.2,<4.0.0",
    "requests>=2.31.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-mock>=3.11.1,<4.0.0",
    "flake8>=6.1.0,<7.0.0",
    "black>=23.9.1,<24.0.0",
    "isort>=5.12.0,<6.0.0",
    "mypy>=1.6.0,<2.0.0"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
extend-exclude = '''
/.git
/.venv
/__pycache__
'''

[tool.isort]
profile = "black"
line_length = 119
known_first_party = ["src"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = '''
venv/
.venv/
'''

[tool.poetry]
# Оставляем для обратной совместимости
name = "transaction-analyser"
version = "1.0.0"
description = "Анализатор банковских транзакций"
authors = ["Студент <student@example.com>"]
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short"
]